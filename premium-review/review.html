<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Big 9 | Responsive design review</title><style>*{box-sizing:border-box}body{margin:0;background:#141c19;color:#fff;font:14px Arial,sans-serif}.bar{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:15px 22px;flex-wrap:wrap}.bar strong{letter-spacing:.08em}.bar p{margin:0;color:#b3c3b7}.controls{display:flex;gap:5px}.controls button{background:#26342c;border:1px solid #637569;color:#fff;padding:9px 13px;cursor:pointer}.controls .active{background:#df502e;border-color:#df502e}.stage{height:calc(100vh - 64px);min-height:550px;display:flex;justify-content:center;padding:16px}iframe{width:100%;max-width:100%;height:100%;border:0;background:#fff;box-shadow:0 20px 80px #0006;border-radius:4px;transition:width .3s}@media(max-width:650px){.stage{height:calc(100vh - 115px);padding:8px}.bar{padding:12px}}</style></head><body><div class="bar"><div><strong>BIG 9 / DESIGN REVIEW</strong><p>Switch viewports, scroll and explore the private concept.</p></div><div class="controls" aria-label="Viewport"><button data-width="390">Mobile 390</button><button data-width="768">Tablet 768</button><button data-width="100%" class="active">Desktop</button></div></div><div class="stage"><iframe title="Big 9 premium homepage preview" src="/premium-review/"></iframe></div><script>document.querySelectorAll('button[data-width]').forEach(b=>b.onclick=()=>{document.querySelector('iframe').style.width=b.dataset.width==='100%'?'100%':b.dataset.width+'px';document.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active')})</script></body></html>
